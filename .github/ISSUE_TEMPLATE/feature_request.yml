name: Feature request
description: Suggest a new repository, method, or improvement
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem does this solve?
          description: What are you trying to do that the library doesn't support today?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: The API you'd like to see (a new repository, method signature, config option, etc.), and if relevant, the Jira Cloud REST API endpoint(s) it maps to.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
