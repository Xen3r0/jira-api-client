name: CI
on:
    push:
        branches: ['main']
    pull_request: ~
jobs:
    coding-standards:
        runs-on: ubuntu-latest
        name: Coding standards
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: dom, json, xml
                  tools: composer:v2
                  coverage: none

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-8.2-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress

            - name: Coding standards check (PHP CS Fixer)
              run: |
                  vendor/bin/php-cs-fixer fix --dry-run --diff
                  vendor/bin/phpstan analyse

    tests:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ ubuntu-latest ]
                php-versions: [ '8.2', '8.3', '8.4' ]
        name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: dom, json, xml
                  tools: composer:v2
                  coverage: ${{ matrix.php-versions == '8.2' && 'xdebug' || 'none' }}

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-${{ matrix.php-versions }}-

            - run: composer install --prefer-dist --no-progress

            - name: Run tests
              if: matrix.php-versions != '8.2'
              run: vendor/bin/phpunit

            - name: Run tests with coverage
              if: matrix.php-versions == '8.2'
              run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml --coverage-cobertura=coverage-cobertura.xml

            - name: Upload coverage report
              if: matrix.php-versions == '8.2'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage.xml

            - name: Build coverage summary
              if: matrix.php-versions == '8.2'
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                  filename: coverage-cobertura.xml
                  badge: true
                  format: markdown
                  output: both

            - name: Add coverage summary to job summary
              if: matrix.php-versions == '8.2'
              run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
